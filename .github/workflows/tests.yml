name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be asked for without pushing something to ask for it.
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quill
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: quillstack
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U quill"
          --health-interval 5s --health-timeout 5s --health-retries 20

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: quillstack
          MYSQL_USER: quill
          MYSQL_PASSWORD: secret
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: Unit tests
        env:
          QUILLSTACK_PGSQL_DSN: "pgsql:host=127.0.0.1;port=55432;dbname=quillstack"
          QUILLSTACK_MYSQL_DSN: "mysql:host=127.0.0.1;port=53306;dbname=quillstack"
          QUILLSTACK_DB_USER: quill
          QUILLSTACK_DB_PASSWORD: secret
        run: vendor/bin/unit-tests

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quill
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: quillstack
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U quill"
          --health-interval 5s --health-timeout 5s --health-retries 20

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: quillstack
          MYSQL_USER: quill
          MYSQL_PASSWORD: secret
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: Unit tests with coverage
        env:
          QUILLSTACK_PGSQL_DSN: "pgsql:host=127.0.0.1;port=55432;dbname=quillstack"
          QUILLSTACK_MYSQL_DSN: "mysql:host=127.0.0.1;port=53306;dbname=quillstack"
          QUILLSTACK_DB_USER: quill
          QUILLSTACK_DB_PASSWORD: secret
        run: phpdbg -qrr vendor/bin/unit-tests

      # Only where the token is there, so a fork or a repository without it still passes.
      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        # Reporting, not a gate: a token which has expired should not turn a green suite red.
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
